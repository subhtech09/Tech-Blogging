<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      {% include logo-mark.html id="header" %}
      <span class="brand-name">{{ site.title }}</span>
    </a>

    <nav id="site-nav" class="site-nav" aria-label="Main">
      <ul>
        {%- for item in site.data.navigation.main %}
        <li><a href="{{ item.url | relative_url }}"{% if page.url == item.url or page.url contains item.url and item.url != '/' %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
        {%- endfor %}
      </ul>
    </nav>

    <div class="header-actions">
      <a class="icon-btn" href="{{ '/write/' | relative_url }}" data-admin-only hidden aria-label="Write an article" title="Write an article">
        {% include icon.html name="pen" %}
      </a>
      <a class="icon-btn" href="{{ '/moderate/' | relative_url }}" data-admin-only hidden aria-label="Moderate comments" title="Moderate comments">
        {% include icon.html name="shield" %}
      </a>
      <a class="icon-btn" href="{{ '/search/' | relative_url }}" data-search-link aria-label="Search (press /)" title="Search (press /)">
        {% include icon.html name="search" %}
      </a>
      <button class="icon-btn theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
        {% include icon.html name="moon" %}
        {% include icon.html name="sun" %}
      </button>
      <button class="icon-btn nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Open menu">
        <span class="nav-toggle-bars" aria-hidden="true"><span></span><span></span><span></span></span>
      </button>
    </div>
  </div>
</header>
