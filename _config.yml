# =============================================================================
#  Site settings — edit this block first
# =============================================================================
title: The Architect's Handbook
tagline: Data architecture, data engineering & AI engineering
description: >-
  Diagram-first deep dives on designing data platforms, building reliable
  pipelines and shipping AI systems to production.
author: subhasis            # key into _data/authors.yml
lang: en
timezone: UTC               # set to your local zone, e.g. Asia/Kolkata

# -----------------------------------------------------------------------------
#  GitHub Pages address
#  Repo "Tech-Blogging" is a *project site*  ->  https://subhtech09.github.io/Tech-Blogging
#  If you rename the repo to "subhtech09.github.io" (a *user site*), or use a
#  custom domain, set  baseurl: ""  and update url accordingly.
# -----------------------------------------------------------------------------
url: "https://subhtech09.github.io"
baseurl: "/Tech-Blogging"   # case-sensitive: must match the repo name exactly

# Default social-preview image (used when a post has no `image:`)
og_default_image: /assets/images/og-default.jpg

twitter:
  card: summary_large_image

# =============================================================================
#  Posts
# =============================================================================
permalink: /blog/:title/
future: false               # posts dated in the future stay unpublished
words_per_minute: 200

defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/og-default.jpg
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: subhasis
      share: true
      comments: true

# =============================================================================
#  Markdown & code highlighting (GitHub Pages defaults)
# =============================================================================
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  syntax_highlighter: rouge

# =============================================================================
#  Plugins — only GitHub Pages–whitelisted plugins are used
# =============================================================================
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml

# =============================================================================
#  Article comments via giscus (stored as GitHub Discussions in this repo).
#  Comments appear once category_id is filled in — see README.md, section 7.
# =============================================================================
giscus:
  enabled: true
  repo: subhtech09/Tech-Blogging
  repo_id: ""                 # from https://giscus.app (the old ID belonged to the deleted repo)
  category: Announcements
  category_id: ""             # from https://giscus.app after enabling Discussions
  mapping: pathname

# =============================================================================
#  Article view counts via GoatCounter (free, no cookies). The view counter
#  appears once code is filled in — see README.md, section 7.
# =============================================================================
goatcounter:
  code: ""                    # e.g. "architects-handbook" for https://architects-handbook.goatcounter.com

# =============================================================================
#  Build
# =============================================================================
theme: null                 # this site ships its own layouts; don't load GitHub's default theme

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - tools
  - .jekyll-cache
  - .sass-cache
