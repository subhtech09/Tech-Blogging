# =============================================================================
#  Site settings — edit this block first
# =============================================================================
title: The Intelligence Stack
tagline: Data architecture, data engineering & AI engineering
description: >-
  Diagram-first deep dives on designing data platforms, building reliable
  pipelines and shipping AI systems to production.
author: subhasis            # key into _data/authors.yml
lang: en
timezone: UTC               # set to your local zone, e.g. Asia/Kolkata

# -----------------------------------------------------------------------------
#  Site address — hosted on Azure Static Web Apps at the custom domain
#  theintelligencestack.tech (DNS at Cloudflare), served from the domain root.
# -----------------------------------------------------------------------------
url: "https://theintelligencestack.tech"
baseurl: ""                 # Azure Static Web Apps serves the site from the domain root

# Default social-preview image (used when a post has no `image:`)
og_default_image: /assets/images/og-default.jpg

twitter:
  card: summary_large_image

# =============================================================================
#  Posts
# =============================================================================
permalink: /blog/:title/
future: false               # posts dated in the future stay unpublished
words_per_minute: 200

defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/og-default.jpg
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: subhasis
      share: true
      comments: true

# =============================================================================
#  Markdown & code highlighting (GitHub Pages defaults)
# =============================================================================
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  syntax_highlighter: rouge

# =============================================================================
#  Plugins — only GitHub Pages–whitelisted plugins are used
# =============================================================================
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml

# =============================================================================
#  Article comments, stored in Azure Cosmos DB through the site's own /api
#  functions (needs Azure Static Web Apps hosting — see README.md, section 7).
#  Readers don't sign in; Cloudflare Turnstile and a moderation queue at
#  /moderate/ keep spam out. Comments appear once turnstile_site_key is set.
# =============================================================================
comments:
  enabled: true
  api: /api                   # served from the domain root by Static Web Apps
  turnstile_site_key: "0x4AAAAAAFirEz5RjelBPL-O"   # Cloudflare Turnstile site key (public)

# =============================================================================
#  Article view counts via GoatCounter (free, no cookies). The view counter
#  appears once code is filled in — see README.md, section 7.
# =============================================================================
goatcounter:
  code: "tech-blogging"       # dashboard: https://tech-blogging.goatcounter.com

# =============================================================================
#  Build
# =============================================================================
theme: null                 # this site ships its own layouts; don't load GitHub's default theme

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - api                       # Azure Functions, deployed separately by Static Web Apps
  - tools
  - .jekyll-cache
  - .sass-cache
