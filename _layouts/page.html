---
layout: default
---
<section class="page-hero band">
  <div class="container">
    {%- if page.eyebrow %}
    <p class="eyebrow">{{ page.eyebrow }}</p>
    {%- endif %}
    <h1>{{ page.title | escape }}</h1>
    {%- if page.description %}
    <p class="page-lede">{{ page.description }}</p>
    {%- endif %}
  </div>
</section>

<section class="section section--page">
  {%- if page.prose == false %}
  <div class="container">
    {{ content }}
  </div>
  {%- else %}
  <div class="container container--narrow">
    <div class="prose">
      {{ content }}
    </div>
  </div>
  {%- endif %}
</section>
